name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the recipes of the base: the names the spin uses must exist there or in the spin
      - uses: actions/checkout@v7
        with:
          repository: vovawees/CleanLinux-Recipes
          path: .base

      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar -xJ
          sudo install -m755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck

      - name: shellcheck
        run: shellcheck -x tools/*.sh && shellcheck -s bash spin.conf packages/*/recipe

      - name: lint, download the sources and verify their sha256
        run: tools/lint.sh --fetch --base .base/packages
