# spin.conf: what the spin installs and enables. Static shell: burn reads the values, it does not run
# the file. The format and the contract with the base: docs/SPINS.md of CleanLinux.
SPIN_NAME=labwc
SPIN_DESC="labwc: a light stacking Wayland compositor (wlroots), the foot terminal, PipeWire sound"
SPIN_BASE=1
SPIN_PACKAGES=(labwc foot dejavu-fonts pipewire wireplumber turnstile seatd dbus labwc-spin)
SPIN_FEATURES="wayland -x11"
SPIN_SERVICES=(dbus seatd turnstiled)        # seatd: the seat of the group "seat"; turnstile: dinit --user
SPIN_USER_SERVICES=(dbus pipewire wireplumber) # the session bus and sound of every user
