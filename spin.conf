# spin.conf: what the spin installs and enables. Static shell: burn reads the values, it does not run
# the file. The format and the contract with the base: docs/SPINS.md of CleanLinux.
SPIN_NAME=labwc
SPIN_DESC="labwc: a light Wayland desktop with a panel, touch and an on-screen keyboard (PC, handhelds)"
SPIN_DESC_RU="labwc: лёгкий рабочий стол Wayland с панелью, сенсором и экранной клавиатурой (ПК, консоли)"
SPIN_BASE=1
# the desktop: the compositor, the panel (sfwbar: start menu, windows, tray, sound, network,
# battery, notifications), wallpaper, lock and idle, screenshots, the clipboard, brightness, screen
# setup, on-screen keyboards (wvkbd), rotation by the accelerometer (iio-sensor-proxy), Bluetooth
# (bluez; headphones through PipeWire); the session: elogind (seats, suspend and power off for
# users, the power key) with polkit, turnstile, PipeWire
SPIN_PACKAGES=(labwc foot dejavu-fonts sfwbar wvkbd swaybg swaylock swayidle grim slurp wl-clipboard
	brightnessctl wlr-randr iio-sensor-proxy bluez gdk-pixbuf-nanosvg cleanlinux-icon-theme
	pipewire wireplumber elogind polkit turnstile seatd dbus labwc-spin)
# elogind: logind for libseat, PipeWire and swayidle (the seat of every user who logs in);
# bluetooth: Bluetooth audio of PipeWire (A2DP, HFP)
SPIN_FEATURES="wayland -x11 elogind bluetooth"
SPIN_SERVICES=(dbus elogind polkitd seatd turnstiled bluetoothd) # seatd: for the users of the group "seat"
SPIN_USER_SERVICES=(dbus pipewire wireplumber)       # the session bus and sound of every user
